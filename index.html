oftmax、ReLU、Dropout、Distribution Shift</td>\n      </tr>\n      <tr id=\"row-week-03\" style=\"display: none;\">\n        <td>03</td>\n        <td><strong><a href=\"#/week-03\">AI 為什麼每次都不一樣？</a></strong> <span class=\"badge-new\">剛生成</span></td>\n        <td><span class=\"val-up\">GAN 與交叉熵・KL 散度</span> / 台股 $[20,8]$ 預測 AI Canvas / <span class=\"val-down\">192 萬筆滑動視窗</span></td>\n        <td>潛張量 $z$、StyleGAN、AdaIN、Cross-Entropy、Soft Target</td>\n      </tr>\n      <tr>\n        <td>05</td>\n        <td><strong><a href=\"#/week-05\">Transformer 與 Vibe Coding 實作</a></strong> <span class=\"badge-new\">最新</span></td>\n        <td><span class=\"val-up\">QKV 自注意力與位置編碼</span> / 台股選股報告產生器 / <span class=\"val-down\">GitHub Actions 自動化</span></td>\n        <td>RNN、Self-Attention、ResNet、RMSNorm、規格書驅動開發</td>\n      </tr>\n    </tbody>\n  </table>\n\n  <p class=\"table-footnote\">教材來源：每週課堂講義 <code>raw/PPT/XX_*.pdf</code> 與作業實作 <code>raw/HW/XX_*.pdf</code> 雙源交叉比對。</p>\n  <p style=\"margin-top: 0.5rem;\"><a href=\"#/week-05\">點選任一週次，查看該週完整課程精要 →</a></p>\n\n  <div class=\"callout-box\">\n    <span class=\"callout-title\">最新課程重點（Week 05｜Transformer 注意力機制與 Vibe Coding 互動網頁）</span>\n    <ul>\n      <li><strong>從 RNN 到 Transformer 自注意力機制</strong>：RNN 透過隱藏狀態 $\\mathbf{h}_{t-1}$ 逐步傳遞記憶；Transformer 則以矩陣內積一次平行算完所有字詞的相關性 $\\text{Attention}(Q,K,V) = \\text{softmax}(QK^T/\\sqrt{d_k})V$，並除以 $\\sqrt{d_k}$ 解決 Softmax「贏者通吃」問題。</li>\n      <li><strong>位置編碼與深層穩定技術</strong>：透過不同頻率的 $(\\sin, \\cos)$ 時鐘向量補回平行運算缺少的字序資訊，並搭配 <strong>ResNet 殘差連結（$\\mathbf{z}+\\ell(\\mathbf{z})$）</strong>與 <strong>LayerNorm / RMSNorm / Dynamic Tanh (DyT)</strong> 確保深層網路穩定訓練。</li>\n      <li><strong>Vibe Coding 必殺技（規格書先行）</strong>：先請 AI 透過問答釐清需求、共同產出完整「程式規格書」，再生成單一檔案 <code>index.html</code> 並部署至 GitHub Pages。</li>\n      <li><strong>台股盤後選股報告產生器（W3 模型 + W4 規則 + W5 網站閉環）</strong>：採用台灣 50 成分股（<code>20 交易日 × 8 項價量籌碼特徵</code>）訓練 Softmax 迴歸並將權重內嵌前端，驗證期 $P(\\text{上漲})\\ge 60\\%$ 群組實際上漲率達 <code>58.8%</code>。</li>\n      <li><strong>確定性程式與 MLOps 防護</strong>：將 W4 篩選排序與 250~300 字白話重點改由 JavaScript 確定性程式實作，並於 GitHub Actions 每日排程加入「籌碼覆蓋率 &lt; 80% 自動回退前一交易日」機制，避免未公布資料補 0 造成預測失真。</li>\n    </ul>\n  </div>\n</div>\n", "_sidebar.md": "* **課程總覽**\n  * [課程摘要首頁](index.md)\n* **每週課程精要**\n  * [Week 01｜如何不焦慮地學 AI](week-01.md)\n  * [Week 02｜神經網路與手寫辨識](week-02.md)\n  * [Week 03｜AI 為什麼每次都不一樣](week-03.md)\n  * [Week 05｜Transformer 與 Vibe Coding · 最新](week-05.md)\n", "index.md": "# 生成式 AI 課程摘要與數位索引\n\n<p class=\"report-subtitle\">將每週課堂講義與作業實作化繁為簡，打造快速檢索、高效複習的結構化知識庫。</p>\n\n<div class=\"pill-row\">\n  <span class=\"badge badge-sky\">TAICA 生成式 AI</span>\n  <span class=\"badge badge-sky\">文字與圖像生成的原理與實務</span>\n  <span class=\"badge badge-sky\">結構化複習筆記</span>\n</div>\n\n<hr class=\"report-divider\" />\n\n<div class=\"agent-console-card\" id=\"ta-compiler-panel\">\n  <div class=\"section-kicker\" style=\"margin-bottom: 0.45rem;\">⚡ 自動化維護 Agent 實測控制台（供助教一鍵體驗 Week 03 教材編譯生成）</div>\n  <p style=\"margin: 0.25rem 0 0.65rem 0; font-size: 0.92rem;\">\n    系統偵測到 <code>raw/PPT/</code> 與 <code>raw/HW/</code> 已放入<strong>第 03 週原始教材 PDF</strong>（唯讀來源檔）：<br/>\n    • <strong>課堂講義</strong>：<a href=\"raw/PPT/03AI為什麼每次都不一樣？.pdf\" target=\"_blank\"><code>raw/PPT/03AI為什麼每次都不一樣？.pdf</code></a>（102 頁）<br/>\n    • <strong>作業實作</strong>：<a href=\"raw/HW/03_中興大學 8113026207 科管博 薛慧婷.pdf\" target=\"_blank\"><code>raw/HW/03_中興大學 8113026207 科管博 薛慧婷.pdf</code></a>（2 頁，呆萌型台股預測機器人 AI Canvas）\n  </p>\n  <div class=\"agent-btn-row\">\n    <button id=\"btn-compile-w03\" class=\"btn-agent-primary\" onclick=\"window.runAgentCompileWeek03()\">\n      ⚡ 一鍵執行 Agent 編譯生成 Week 03 頁面\n    </button>\n    <a id=\"btn-goto-w03\" href=\"#/week-03\" class=\"btn-agent-success\" style=\"display: none;\">\n      👉 立即前往剛生成的 Week 03 課程精要頁面 →\n    </a>\n    <button id=\"btn-reset-w03\" class=\"btn-agent-secondary\" style=\"display: none;\" onclick=\"window.resetAgentCompileWeek03()\">\n      🔄 重置回「待編譯」狀態（供重複測試）\n    </button>\n  </div>\n  <div id=\"agent-compile-console\" ic Tanh (DyT)</strong> 確保深層網路穩定訓練。</li>\n      <li><strong>Vibe Coding 必殺技（規格書先行）</strong>：先請 AI 透過問答釐清需求、共同產出完整「程式規格書」，再生成單一檔案 <code>index.html</code> 並部署至 GitHub Pages。</li>\n      <li><strong>台股盤後選股報告產生器（W3 模型 + W4 規則 + W5 網站閉環）</strong>：採用台灣 50 成分股（<code>20 交易日 × 8 項價量籌碼特徵</code>）訓練 Softmax 迴歸並將權重內嵌前端，驗證期 $P(\\text{上漲})\\ge 60\\%$ 群組實際上漲率達 <code>58.8%</code>。</li>\n      <li><strong>確定性程式與 MLOps 防護</strong>：將 W4 篩選排序與 250~300 字白話重點改由 JavaScript 確定性程式實作，並於 GitHub Actions 每日排程加入「籌碼覆蓋率 &lt; 80% 自動回退前一交易日」機制，避免未公布資料補 0 造成預測失真。</li>\n    </ul>\n  </div>\n</div>\n", "week-01.md": "<div class=\"back-nav-bar\">\n  <a href=\"#/\" class=\"btn-back-index\">← 回到課程總覽目錄</a>\n  <a href=\"#/week-02\" class=\"btn-back-index\">下一週：Week 02 神經網路與手寫辨識 →</a>\n</div>\n\n# 第 01 週課程精要：如何不焦慮地學 AI\n\n<p class=\"report-subtitle\">整合課堂函數映射原理、Colab 四大實作技巧與三大迴歸模型（OLS・3D 多元迴歸・邏輯斯分類）複習筆記。</p>\n\n<div class=\"pill-row\">\n  <span class=\"badge badge-sky\">Week 01</span>\n  <span class=\"badge badge-sky\">課程理論 × 作業實作</span>\n  <span class=\"badge badge-emerald\">結構化複習筆記</span>\n</div>\n\n<hr class=\"report-divider\" />\n\n<div class=\"dashboard-card\">\n  <div class=\"section-kicker\">▼ 概覽：本週教材來源與複習區段</div>\n  <p style=\"margin: 0.25rem 0 0.75rem 0;\">\n    <strong>課堂講義來源</strong>：<a href=\"raw/PPT/01如何不焦慮地學AI(學生點開顯示未發佈).pdf\" target=\"_blank\">01如何不焦慮地學AI(學生點開顯示未發佈).pdf</a>（政治大學 蔡炎龍老師）<br/>\n    <strong>作業實作來源</strong>：<a href=\"raw/HW/01_中興大學 8113026207 科管博 薛慧婷 在colab中畫一個函數圖形-1.pdf\" target=\"_blank\">01_中興大學 8113026207 科管博 薛慧婷 在colab中畫一個函數圖形-1.pdf</a>（<a href=\"https://colab.research.google.com/drive/1AvKUfqU-4r3NtyNeic_gxuS3W4U2ur45?usp=sharing\" target=\"_blank\">開啟 Colab 筆記本</a>）\n  </p>\n  <div class=\"pill-row\">\n    <span class=\"badge badge-emerald\">一、課程摘要</span>\n    <span class=\"badge badge-outline\">二、作業摘要</span>\n    <span class=\"badge badge-outline\">三、技術關聯與延伸應用</span>\n  </div>\n  <p class=\"table-footnote\">本頁依「課程摘要」、「作業摘要」、「技術關聯與延伸應用」結構編排，各區段標題右側均可直接點選開啟原始 PDF 檔案。</p>\n</div>\n\n<div class=\"module-block block-a\">\n  <div class=\"card-title\">\n    <span>一、課程摘要 <span class=\"pipe-sep\">｜</span> 用原理對抗 AI 焦慮・萬物皆函數 $Y = f_\\theta(X)$</span>\n    <a href=\"raw/PPT/01如何不焦慮地學AI(學生點開顯示未發佈).pdf\" target=\"_blank\" class=\"pdf-link\">📄 開啟課堂講義 PDF</a>\n  </div>\n\n  <table>\n    <thead>\n      <tr>\n        <th>序號</th>\n        <th>核心議題 / 工具模組</th>\n        <th>痛點迷思 / 語法特徵</th>\n        <th>底層原理與解法</th>\n        <th>複習關鍵指標</th>\n      </tr>\n    </thead>\n    <tbody>\n      <tr>\n        <td>1</td>\n        <td><strong>三大 AI 焦慮破除</strong></td>\n        <td><span class=\"val-up\">被取代</span> / 工具學不完 / 名詞太難</td>\n        <td>各家基礎模型架構相似；Agent 只是「教 AI 做事的流程」</td>\n        <td>用原理對抗焦慮</td>\n      </tr>\n      <tr>\n        <td>2</td>\n        <td><strong>呆萌型 AI 機器人</strong></td>\n        <td>以為 AI 有自主意識與思考能力</td>\n        <td>本質皆為參數化函數映射 $X \\xrightarrow{f_\\theta} Y$（含分類與生成）</td>\n        <td><span class=\"val-down\">Turing &amp; Feynman</span></td>\n      </tr>\n      <tr>\n        <td>3</td>\n        <td><strong>Colab 魔術與繪圖</strong></td>\n        <td><code>%matplotlib inline</code> / <code>!pwd</code></td>\n        <td>以 <code>np</code>, <code>pd</code>, <code>plt</code> 繪圖，並用 <code>zip(*points)</code> 轉換座標</td>\n        <td><code>Shift+Enter</code> / <code>Tab</code></td>\n      </tr>\n      <tr>\n        <td>4</td>\n        <td><strong>筆記與動態互動</strong></td>\n        <td><code>Ctrl+M M</code> / <code>ipywidgets</code></td>\n        <td>支援 LaTeX 數學式與 <code>interact(draw, n=(1., 10.))</code> 滑桿</td>\n        <td>即時視覺化試驗場</td>\n      </tr>\n    </tbody>\n  </table>\n\n  <p class=\"table-footnote\">全學期技術主線：神經網路（Neural Networks）→ 生成對抗網路（GAN）→ 大型語言模型（LLM / RAG / Agent）→ 擴散模型（Diffusion Models）。</p>\n\n  <div class=\"callout-box\">\n    <span class=\"callout-title\">課程摘要重點</span>\n    <ul>\n      <li><strong>呆萌型函數本質</strong>：現代 AI 模型（包含影像辨識與生成式 AI）本身沒有自主意識，本質上都是一個接收輸入 $X$、計算輸出 $Y$ 的參數化函數 $f_\\theta$。</li>\n      <li><strong>分類與生成的統一視角</strong>：拍一張八哥照片輸入模型，是算出三個機率數字 $(y_1, y_2, y_3)$ 分別代表土八哥、白尾八哥與家八哥；文字與圖像生成則是將 Prompt 當作輸入 $X$ 映射出生成結果 $Y$。</li>\n      <li><strong>破除工具焦慮</strong>：大型語言模型底層原理高度相通，掌握「函數映射」原理與 Colab 實作工具鏈後，就能讓 AI 照我們的方法做事，不再因每日新工具而焦慮。</li>\n    </ul>\n  </div>\n</div>\n\n<div class=\"module-block block-b\">\n  <div class=\"card-title\">\n    <span>二、作業摘要 <span class=\"pipe-sep\">｜</span> Colab 函數與三大迴歸實作（OLS・3D 平面・Sigmoid）</span>\n    <a href=\"raw/HW/01_中興大學 8113026207 科管博 薛慧婷 在colab中畫一個函數圖形-1.pdf\" target=\"_blank\" class=\"pdf-link\">📄 開啟作業實作 PDF</a>\n  </div>\n\n  <table>\n    <thead>\n      <tr>\n        <th>階段</th>\n        <th>模型名稱與維度</th>\n        <th>估計方程式 / 轉換函數</th>\n        <th>關鍵特徵與實驗數據</th>\n        <th>預測表現 / 診斷結論</th>\n      </tr>\n    </thead>\n    <tbody>\n      <tr>\n        <td>0</td>\n        <td><strong>基礎線性函數 (1D)</strong></td>\n        <td>$f(x) = 3x + 2$</td>\n        <td><code>np.linspace(-10, 10, 100)</code></td>\n        <td>斜率固定為 $3$、截距為 $2$</td>\n      </tr>\n      <tr>\n        <td>I</td>\n        <td><strong>簡單線性迴歸 (OLS)</strong></td>\n        <td>$\\hat{Y} = 40.0 + 8.5X$</td>\n        <td>讀書時數 $X \\in [1,5]$ → 考分 $Y$</td>\n        <td><span class=\"val-up\">+8.5 分/時</span>｜$X=3.5 \\Rightarrow 69.75$ 分</td>\n      </tr>\n      <tr>\n        <td>II</td>\n        <td><strong>多元線性迴歸 (3D)</strong></td>\n        <td>$\\hat{Y} = -8.45 + 4.02X_1 + 0.91X_2$</td>\n        <td>時數 $X_1$ ＋ 出席率 $X_2 \\in [60,95]$</td>\n        <td><span class=\"val-up\">+4.02 分/時</span>、<span class=\"val-down\">+0.91 分/1%出席</span></td>\n      </tr>\n      <tr>\n        <td>III</td>\n        <td><strong>邏輯斯迴歸 (分類)</strong></td>\n        <td>$P(Y=1\\mid\\mathbf{X}) = \\frac{1}{1+e^{-z}}$</td>\n        <td>200 筆雙特徵樣本｜預設門檻 <code>50%</code></td>\n        <td>輸出 $0\\sim 1$ 機率與線性決策邊界</td>\n      </tr>\n    </tbody>\n  </table>\n\n  <p class=\"table-footnote\">Part I 殘差表檢驗：5 筆觀測值之殘差 $e = Y - \\hat{Y}$ 分別為 $+1.5, -2.0, -0.5, -4.0, +2.5$，隨機散佈於 $y=0$ 基準線上下，符合線性假設。</p>\n\n  ```python\n  # Part I ~ III 核心建模與 3D / 決策邊界視覺化精要\n  from sklearn.linear_model import LinearRegression, LogisticRegression\n  import numpy as np\n\n  # 1. 多元線性迴歸：讀書時數 (X1) + 出席率 (X2) -> 考試分數 (y)\n  X1, X2 = np.array([1, 2, 3, 4, 5]), np.array([60, 70, 75, 90, 95])\n  y = np.array([50, 65, 70, 85, 98])\n  reg = LinearRegression().fit(np.column_stack((X1, X2)), y)\n\n  # 2. 邏輯斯迴歸：線性組合 z 轉為 Sigmoid 機率 P(Y=1|X)\n  # z = clf.decision_function(X_cls)\n  # prob = 1 / (1 + np.exp(-z))  # 等同 clf.predict_proba(X_cls)[:, 1]\n  ```\n\n  <div class=\"callout-box\">\n    <span class=\"callout-title\">作業摘要重點</span>\n    <ul>\n      <li><strong>從固定公式到數據擬合</strong>：將課堂基礎繪圖 $f(x)=3x+2$ 延伸至最小平方法（OLS），自動從資料點找出使垂直誤差平方和（SSE）最小的最佳擬合線。</li>\n      <li><strong>殘差圖（Residual Plot）診斷</strong>：透過檢視誤差項 $e = Y - \\hat{Y}$ 是否隨機分佈於 $y=0$ 基準線上下，確認線性模型假設是否成立，並辨識高估（$e < 0$）與低估（$e > 0$）樣本。</li>\n      <li><strong>3D 多元迴歸與控制變因（Ceteris Paribus）</strong>：同時納入讀書時數 $X_1$ 與出席率 $X_2$ 後，在固定出席率下每多讀 1 小時平均提升 $+4.02$ 分，固定時數下出席率每增加 1% 則提升 $+0.91$ 分（若讀書 $3.5$ 小時且出席率 $80\\%$，聯合預測為 $78.42$ 分）。</li>\n    </ul>\n  </div>\n</div>\n\n<div class=\"module-block block-c\">\n  <div class=\"card-title\">\n    <span>三、技術關聯與延伸應用 <span class=\"pipe-sep\">｜</span> 銀行信用卡違約審查 <span class=\"pipe-sep\">｜</span> 門檻 50%（可動態調校）</span>\n  </div>\n\n  <table>\n    <thead>\n      <tr>\n        <th>決策維度</th>\n        <th>觀察圖表與指標</th>\n        <th>理想狀態 / 放寬策略 / 緊縮策略</th>\n        <th>模型診斷與實務行動</th>\n      </tr>\n    </thead>\n    <tbody>\n      <tr>\n        <td><strong>信心度判讀</strong></td>\n        <td>圖 1：Sigmoid 預測機率分佈</td>\n        <td><span class=\"val-down\">兩極化（5% 或 95%）</span> vs. <span class=\"val-up\">集中於 48%~52%</span></td>\n        <td>若多數樣本卡在 50% 附近，代表特徵不足、系統在瞎猜</td>\n      </tr>\n      <tr>\n        <td><strong>動態門檻調整</strong></td>\n        <td>圖 1：違約拒絕門檻（Threshold）</td>\n        <td>預設 <code>50%</code> / <span class=\"val-down\">景氣好放寬至 70%</span> / <span class=\"val-up\">海嘯收緊至 20%</span></td>\n        <td>不需重訓模型，直接依總經環境調整核貸風險胃納量</td>\n      </tr>\n      <tr>\n        <td><strong>線性可分檢驗</strong></td>\n        <td>圖 2：二維決策邊界（直尺切分）</td>\n        <td>紅藍對角分群（線性可分） vs. 紅點包在藍點中間</td>\n        <td>若無法用一條直線切開，即需引入多層神經網路（MLP）</td>\n      </tr>\n      <tr>\n        <td><strong>例外客戶挖掘</strong></td>\n        <td>圖 2：高風險區的正常還款藍點</td>\n        <td>低收入＋高負債卻未違約之離群樣本</td>\n        <td>點開個案追查是否具備「隱形資產」，迭代新特徵</td>\n      </tr>\n    </tbody>\n  </table>\n\n  <p class=\"table-footnote\">跨週次演進：本週作業的「線性組合 $z = \\mathbf{w}^T\\mathbf{x} + b$ ＋ Sigmoid 激活函數 $\\sigma(z)$」，正是第 02 週人工神經網路（ANN）中單一人工神經元的完整數學結構。</p>\n\n  <div class=\"callout-box\">\n    <span class=\"callout-title\">技術關聯與延伸應用重點</span>\n    <ul>\n      <li><strong>機率門檻的商業彈性</strong>：在銀行信用卡違約審查中，Sigmoid 機率圖能協助決策者依總經環境動態調整核貸門檻——景氣擴張衝業績時可放寬至 <code>70%</code> 才拒貸，金融海嘯保守風控時則收緊至 <code>20%</code> 即拒貸。</li>\n      <li><strong>模型區辨力檢測</strong>：理想模型應讓客戶違約機率集中在 <code>5%</code> 或 <code>95%</code> 兩端；若大量集中在 <code>48%~52%</code>，代表現有特徵不足以區分風險。</li>\n      <li><strong>線性分類邊界的極限與神經網路伏筆</strong>：當二維特徵空間中的違約紅點被正常藍點包圍在正中央時，任何一條直線都無法切開，這直接揭示了非線性問題必須引入多層神經網路（DNN）來解決。</li>\n    </ul>\n  </div>\n</div>\n\n<div class=\"back-nav-bar\" style=\"margin-top: 2rem;\">\n  <a href=\"#/\" class=\"btn-back-index\">← 回到課程總覽目錄</a>\n  <a href=\"#/week-02\" class=\"btn-back-index\">前往 Week 02：神經網路與手寫辨識 →</a>\n</div>\n", "week-02.md": "<div class=\"back-nav-bar\">\n  <a href=\"#/\" class=\"btn-back-index\">← 回到課程總覽目錄</a>\n  <div>\n    <a href=\"#/week-01\" class=\"btn-back-index\">← 上一週：Week 01</a>\n    <a href=\"#/week-03\" class=\"btn-back-index\">下一週：Week 03 →</a>\n  </div>\n</div>\n\n# 第 02 週課程精要：神經網路原理與 DNN 手寫辨識實作\n\n<p class=\"report-subtitle\">從神經元數學模型、Softmax 機率轉換與梯度下降法，到 MNIST 四版本控制變因實驗與 Gradio 部署診斷。</p>\n\n<div class=\"pill-row\">\n  <span class=\"badge badge-sky\">Week 02</span>\n  <span class=\"badge badge-sky\">神經網路與函數學習機</span>\n  <span class=\"badge badge-emerald\">DNN 手寫辨識實作</span>\n</div>\n\n<hr class=\"report-divider\" />\n\n<div class=\"dashboard-card\">\n  <div class=\"section-kicker\">▼ 概覽：本週教材來源與複習區段</div>\n  <p style=\"margin: 0.25rem 0 0.75rem 0;\">\n    <strong>課堂講義來源</strong>：<a href=\"raw/PPT/02神經網路的概念.pdf\" target=\"_blank\">02神經網路的概念.pdf</a>（共 123 頁，政治大學 蔡炎龍老師）<br/>\n    <strong>作業實作來源</strong>：<a href=\"raw/HW/02_中興大學 8113026207 科管博 薛慧婷 打造自己的DNN(全連結)手寫辨識.pdf\" target=\"_blank\">02_中興大學 8113026207 科管博 薛慧婷 打造自己的DNN(全連結)手寫辨識.pdf</a>（<a href=\"https://colab.research.google.com/drive/1JIlBtSHSKK1AKTJZmi7qTWSupFrdFdwi?usp=sharing\" target=\"_blank\">開啟 Colab 筆記本</a>）\n  </p>\n  <div class=\"pill-row\">\n    <span class=\"badge badge-emerald\">一、課程摘要</span>\n    <span class=\"badge badge-outline\">二、作業摘要</span>\n    <span class=\"badge badge-outline\">三、技術關聯與延伸應用</span>\n  </div>\n  <p class=\"table-footnote\">本頁依「課程摘要」、「作業摘要」、「技術關聯與延伸應用」結構編排，各區段標題右側均可直接點選開啟原始 PDF 檔案。</p>\n</div>\n\n<div class=\"module-block block-a\">\n  <div class=\"card-title\">\n    <span>一、課程摘要 <span class=\"pipe-sep\">｜</span> 神經網路與函數學習機（Tensor・Softmax・梯度下降）</span>\n    <a href=\"raw/PPT/02神經網路的概念.pdf\" target=\"_blank\" class=\"pdf-link\">📄 開啟課堂講義 PDF</a>\n  </div>\n\n  <table>\n    <thead>\n      <tr>\n        <th>序號</th>\n        <th>核心概念模組</th>\n        <th>數學定義 / 運算機制</th>\n        <th>關鍵結構與性質</th>\n        <th>複習關鍵指標</th>\n      </tr>\n    </thead>\n    <tbody>\n      <tr>\n        <td>1</td>\n        <td><strong>張量 (Tensor) 與編碼</strong></td>\n        <td>0 階純量、1 階向量、2 階矩陣、3 階 RGB 影像</td>\n        <td>分類目標轉為 <strong>One-Hot Encoding</strong>（如 $[1,0,0]^T$）</td>\n        <td>輸入輸出皆須為數字</td>\n      </tr>\n      <tr>\n        <td>2</td>\n        <td><strong>Softmax 機率轉換</strong></td>\n        <td>$p_i = P_\\theta(y_i \\mid \\mathbf{x}) = \\frac{e^{z_i}}{\\sum_j e^{z_j}}$</td>\n        <td>將任意實數輸出轉為總和等於 $1$、保持大小順序之條件機率</td>\n        <td><span class=\"val-down\">多分類輸出層標準配置</span></td>\n      </tr>\n      <tr>\n        <td>3</td>\n        <td><strong>人工神經元與激發函數</strong></td>\n        <td>$h = \\varphi\\left(\\sum_{i=1}^n w_i x_i + b\\right)$</td>\n        <td>以非線性激發函數（現代主流為 <strong>ReLU</strong>）突破線性組合限制</td>\n        <td>權重 $w_i$ 與偏值 $b$</td>\n      </tr>\n      <tr>\n        <td>4</td>\n        <td><strong>神經網路 3+1 架構</strong></td>\n        <td><strong>DNN</strong>（全連結）、<strong>CNN</strong>（影像）、<strong>RNN</strong>（記憶）、<strong>Transformer</strong></td>\n        <td>每層將輸入 Tensor 映射為新特徵向量；具<strong>萬能近似定理</strong>保證</td>\n        <td>決定隱藏層數與神經元數</td>\n      </tr>\n      <tr>\n        <td>5</td>\n        <td><strong>損失函數與梯度下降</strong></td>\n        <td>$L(\\theta) = \\frac{1}{2k}\\sum \\|y_i - f_\\theta(x_i)\\|^2$；更新式 $\\theta \\leftarrow \\theta - \\eta \\nabla L(\\theta)$</td>\n        <td>對各參數取<strong>偏微分</strong>組成梯度 $\\nabla L$，乘上學習率 $\\eta$ 往極小值移動</td>\n        <td><span class=\"val-up\">Backpropagation 反向傳播</span></td>\n      </tr>\n    </tbody>\n  </table>\n\n  <p class=\"table-footnote\">高維度學習本質：根據 Balestriero, Pesenti &amp; LeCun (2021) 研究，高維度空間中的機器學習並非單純「內插（Interpolation）」，而幾乎總是進行「外插（Extrapolation）」。</p>\n\n  <div class=\"callout-box\">\n    <span class=\"callout-title\">課程摘要重點</span>\n    <ul>\n      <li><strong>第一步：輸入與輸出數位化</strong>：將問題轉為張量（例如將 $28 \\times 28$ 的手寫數字影像拉平為 $784$ 維向量，分類答案設為 $10$ 維 One-Hot 向量），並以 Softmax 轉換出各類別機率。</li>\n      <li><strong>第二步：決定神經網路架構</strong>：全連結神經網路（DNN）只需決定「幾層隱藏層」與「每層幾個神經元」，每個神經元透過加權總和、偏值與 ReLU 非線性激發函數，將輸入逐層轉換為高階特徵向量。</li>\n      <li><strong>第三步：損失函數與梯度下降訓練</strong>：定義衡量預測誤差的損失函數 $L(\\theta)$，對每個權重與偏值取偏微分構成梯度向量 $\\nabla L$，並沿著負梯度方向乘上學習率（$\\theta \\leftarrow \\theta - \\eta\\nabla L$）迭代找出最佳參數 $\\theta^*$。</li>\n    </ul>\n  </div>\n</div>\n\n<div class=\"module-block block-b\">\n  <div class=\"card-title\">\n    <span>二、作業摘要 <span class=\"pipe-sep\">｜</span> 打造自己的 DNN 手寫辨識（四版本控制變因實驗）</span>\n    <a href=\"raw/HW/02_中興大學 8113026207 科管博 薛慧婷 打造自己的DNN(全連結)手寫辨識.pdf\" target=\"_blank\" class=\"pdf-link\">📄 開啟作業實作 PDF</a>\n  </div>\n\n  <table>\n    <thead>\n      <tr>\n        <th>實驗版本</th>\n        <th>隱藏層架構（神經元數）</th>\n        <th>激發函數與正則化</th>\n        <th>損失函數 / 優化器</th>\n        <th>測試集 Loss / 正確率</th>\n      </tr>\n    </thead>\n    <tbody>\n      <tr>\n        <td><strong>A 版（老師範例基準）</strong></td>\n        <td>3 層：<code>20 - 20 - 20</code></td>\n        <td><code>relu / relu / tanh</code></td>\n        <td><code>mse</code> ＋ <code>SGD(0.087)</code></td>\n        <td>Loss: <code>0.0084</code> / <strong>94.55%</strong></td>\n      </tr>\n      <tr>\n        <td><strong>B 版（加深窄網路）</strong></td>\n        <td>4 層：<code>20 - 20 - 20 - 20</code></td>\n        <td><code>relu / relu / tanh / relu</code></td>\n        <td><code>mse</code> ＋ <code>SGD(0.087)</code></td>\n        <td><span class=\"val-up\">正確率降至 92.72%</span></td>\n      </tr>\n      <tr>\n        <td><strong>C 版（最終採用版）</strong></td>\n        <td>4 層：<code>512 - 256 - 128 - 64</code></td>\n        <td>全 <code>relu</code> ＋ <code>Dropout(0.3)</code>×2</td>\n        <td><code>categorical_crossentropy</code> ＋ <code>Adam(0.001)</code></td>\n        <td>Loss: <code>0.06598</code> / <span class=\"val-down\">98.12%（最佳）</span></td>\n      </tr>\n      <tr>\n        <td><strong>D 版（控制變因對照）</strong></td>\n        <td>4 層：<code>512 - 256 - 128 - 64</code></td>\n        <td>全 <code>relu</code> ＋ <code>Dropout(0.3)</code>×2</td>\n        <td><code>mse</code> ＋ <code>Adam(0.001)</code></td>\n        <td>Loss: <code>0.0036</code> / <strong>97.82%</strong></td>\n      </tr>\n    </tbody>\n  </table>\n\n  <p class=\"table-footnote\">訓練超參數設定：<code>batch_size = 32</code>、<code>epochs = 10</code>、<code>validation_split = 0.1</code>（切分 10% 訓練資料即時監控未見資料之驗證準確率，C 版於第 8 個 epoch 達最高 <code>val_accuracy = 98.27%</code>）。第一層參數量驗證：$784 \\times 512 + 512 = 402,192$。</p>\n\n  ```python\n  # C 版（最終採用架構）：漸縮式寬隱藏層 + Dropout + Cross-Entropy + Adam\n  from tensorflow.keras.models import Sequential\n  from tensorflow.keras.layers import Input, Dense, Dropout\n  from tensorflow.keras.optimizers import Adam\n\n  model = Sequential([\n      Input(shape=(784,)),\n      Dense(512, activation='relu'),\n      Dropout(0.3),\n      Dense(256, activation='relu'),\n      Dropout(0.3),\n      Dense(128, activation='relu'),\n      Dense(64, activation='relu'),\n      Dense(10, activation='softmax')\n  ])\n\n  model.compile(\n      loss='categorical_crossentropy',\n      optimizer=Adam(learning_rate=0.001),\n      metrics=['accuracy']\n  )\n  ```\n\n  <div class=\"callout-box\">\n    <span class=\"callout-title\">作業摘要重點</span>\n    <ul>\n      <li><strong>不同 Loss 函數不可直接比數值大小</strong>：<code>mse</code>（D 版 0.0036）與 <code>categorical_crossentropy</code>（C 版 0.06598）的數學公式與數值尺度完全不同，不能因 D 版 Loss 數值小就誤判其收斂較佳。</li>\n      <li><strong>控制變因實驗（D 版）找出真正功臣</strong>：固定 C 版架構與 Adam 優化器、僅把 Loss 換回 <code>mse</code> 時，準確率仍達 <code>97.82%</code>，證明拉開 A 版（94.55%）與 C 版（98.12%）差距的主因是<strong>充足的網路容量（512→64）与 Adam 優化器</strong>。</li>\n      <li><strong>加深窄網路的反效果</strong>：B 版在每層僅 20 個神經元的窄網路下強行加深至 4 層，準確率反而跌至 <code>92.72%</code>，顯示特徵寬度不足時加深網路反而阻礙梯度傳遞。</li>\n    </ul>\n  </div>\n</div>\n\n<div class=\"module-block block-c\">\n  <div class=\"card-title\">\n    <span>三、技術關聯與延伸應用 <span class=\"pipe-sep\">｜</span> 測試集 98.12% vs. Gradio 實測落差 <span class=\"pipe-sep\">｜</span> 資料分佈偏移診斷</span>\n  </div>\n\n  <table>\n    <thead>\n      <tr>\n        <th>評估面向</th>\n        <th>實驗現象與觀察數據</th>\n        <th>底層技術成因剖析</th>\n        <th>進階工程優化方案</th>\n      </tr>\n    </thead>\n    <tbody>\n      <tr>\n        <td><strong>Loss 函數選擇</strong></td>\n        <td>C 版（Cross-Entropy <code>98.12%</code>）略優於 D 版（MSE <code>97.82%</code>）</td>\n        <td>Cross-Entropy 針對機率分佈對數懲罰，梯度不會因 Sigmoid/Softmax 飽和而消失</td>\n        <td>多分類任務標準配備 <code>categorical_crossentropy</code></td>\n      </tr>\n      <tr>\n        <td><strong>過擬合抑制</strong></td>\n        <td>寬網路（首層 40.2 萬參數）易死背訓練集</td>\n        <td>在前兩層高維度特徵後加入 <code>Dropout(0.3)</code> 隨機丟棄 30% 神經元</td>\n        <td>搭配 <code>validation_split=0.1</code> 監控泛化能力</td>\n      </tr>\n      <tr>\n        <td><strong>Gradio 部署落差</strong></td>\n        <td>測試集達 <span class=\"val-down\">98.12%</span>，但手寫板實測（尤其數字 <code>6</code> 與 <code>8</code>）判識率明顯波動</td>\n        <td><span class=\"val-up\">資料分佈偏移 (Distribution Shift)</span>：滑鼠手寫筆觸粗細、偏移、比例與歐美 MNIST 樣本不同</td>\n        <td>推論前加入影像預處理（邊界裁切、膨脹加粗、28×28 質心置中）</td>\n      </tr>\n      <tr>\n        <td><strong>全連結層空間限制</strong></td>\n        <td>將 $28 \\times 28$ 影像直接拉平為 $784$ 維向量</td>\n        <td>破壞二維像素之空間鄰近關係，缺乏平移與縮放不變性</td>\n        <td>延伸升級為具備局部感受野之<strong>卷積神經網路 (CNN)</strong></td>\n      </tr>\n    </tbody>\n  </table>\n\n  <p class=\"table-footnote\">AI 協作除錯紀錄：實作過程中透過生成式 AI 輔助診斷 Colab 執行期問題，包含「舊模型變數殘留於記憶體需重啟執行階段（Restart Runtime）」以及「前後變數命名一致性檢查」。</p>\n\n  <div class=\"callout-box\">\n    <span class=\"callout-title\">技術關聯與延伸應用重點</span>\n    <ul>\n      <li><strong>測試集高分不等於部署表現（Distribution Shift）</strong>：MNIST 訓練集經過粗化、抗鋸齒平滑與嚴格置中，且源自歐美書寫習慣；而使用者在 Gradio 介面以滑鼠手寫時筆觸偏細、位置偏移，導致「6」與「8」等數字實測判識率明顯下滑。</li>\n      <li><strong>全連結 DNN 的空間結構盲點</strong>：將 $28 \\times 28$ 影像直接拉平（Flatten）為 $784$ 維向量會破壞二維空間鄰近關係，只要手寫位置稍微平移，對應的權重就無法對齊。</li>\n      <li><strong>後續優化與跨週次演進</strong>：短期可在 Gradio 推論前端加上影像邊界裁切、筆畫膨脹與質心置中預處理；長期則應將模型架構升級為具備局部感受野與平移不變性的<strong>卷積神經網路（CNN）</strong>。</li>\n    </ul>\n  </div>\n</div>\n\n<div class=\"back-nav-bar\" style=\"margin-top: 2rem;\">\n  <a href=\"#/\" class=\"btn-back-index\">← 回到課程總覽目錄</a>\n  <div>\n    <a href=\"#/week-01\" class=\"btn-back-index\">← 上一週：Week 01</a>\n    <a href=\"#/week-03\" class=\"btn-back-index\">下一週：Week 03 →</a>\n  </div>\n</div>\n", "week-03.md": "<div class=\"back-nav-bar\">\n  <a href=\"#/\" class=\"btn-back-index\">← 回到課程總覽目錄</a>\n  <div>\n    <a href=\"#/week-02\" class=\"btn-back-index\">← 上一週：Week 02</a>\n    <a href=\"#/week-05\" class=\"btn-back-index\">下一週：Week 05 →</a>\n  </div>\n</div>\n\n# 第 03 週課程精要：AI 為什麼每次都不一樣？（GAN・交叉熵・AI Canvas 實作）\n\n<p class=\"report-subtitle\">從一對多生成難題、GAN 對抗式網路與 StyleGAN 風格控制，到資訊量、交叉熵（Cross-Entropy）、KL 散度與台股量化預測機器人 AI Canvas 規格設計。</p>\n\n<div class=\"pill-row\">\n  <span class=\"badge badge-sky\">Week 03</span>\n  <span class=\"badge badge-sky\">GAN 與隨機性原理</span>\n  <span class=\"badge badge-emerald\">Cross-Entropy & KL 散度</span>\n  <span class=\"badge badge-emerald\">AI Canvas 企劃實作</span>\n</div>\n\n<hr class=\"report-divider\" />\n\n<div class=\"dashboard-card\">\n  <div class=\"section-kicker\">▼ 概覽：本週教材來源與複習區段</div>\n  <p style=\"margin: 0.25rem 0 0.75rem 0;\">\n    <strong>課堂講義來源</strong>：<a href=\"raw/PPT/03AI為什麼每次都不一樣？.pdf\" target=\"_blank\">03AI為什麼每次都不一樣？.pdf</a>（共 102 頁，政治大學 蔡炎龍老師）<br/>\n    <strong>作業實作來源</strong>：<a href=\"raw/HW/03_中興大學 8113026207 科管博 薛慧婷.pdf\" target=\"_blank\">03_中興大學 8113026207 科管博 薛慧婷.pdf</a>（設計一個呆萌型機器人：台股量化短線趨勢預測機器人）\n  </p>\n  <div class=\"pill-row\">\n    <span class=\"badge badge-emerald\">一、課程摘要</span>\n    <span class=\"badge badge-outline\">二、作業摘要</span>\n    <span class=\"badge badge-outline\">三、技術關聯與延伸應用</span>\n  </div>\n  <p class=\"table-footnote\">本頁依「課程摘要」、「作業摘要」、「技術關聯與延伸應用」結構編排，各區段標題右側均可直接點選開啟原始 PDF 檔案。</p>\n</div>\n\n<div class=\"module-block block-a\">\n  <div class=\"card-title\">\n    <span>一、課程摘要 <span class=\"pipe-sep\">｜</span> AI 為什麼每次都不一樣？（GAN・StyleGAN・交叉熵・KL 散度）</span>\n    <a href=\"raw/PPT/03AI為什麼每次都不一樣？.pdf\" target=\"_blank\" class=\"pdf-link\">📄 開啟課堂講義 PDF</a>\n  </div>\n\n  <table>\n    <thead>\n      <tr>\n        <th>序號</th>\n        <th>核心概念模組</th>\n        <th>數學定義 / 運算機制</th>\n        <th>設計目的與關鍵特性</th>\n        <th>複習關鍵指標</th>\n      </tr>\n    </thead>\n    <tbody>\n      <tr>\n        <td>01</td>\n        <td><strong>一對多生成難題與潛張量</strong></td>\n        <td>$$\\mathbf{y} = f_\\theta(\\mathbf{z}), \\quad \\mathbf{z} \\sim p_{\\mathbf{z}}(\\mathbf{z})$$</td>\n        <td>若直接訓練同一輸入對應多種輸出的函數，模型會輸出模糊的「平均值」；改由隨機抽樣<strong>潛張量（Latent Tensor $\\mathbf{z}$，代表靈感）</strong>送入函數即可每次生成不同作品</td>\n        <td><span class=\"val-steel\">圖像生成隨機性來源</span></td>\n      </tr>\n      <tr>\n        <td>02</td>\n        <td><strong>生成對抗網路 (GAN)</strong></td>\n        <td>$$\\min_G \\max_D V(D,G) = \\mathbb{E}_{x}[\\log D(x)] + \\mathbb{E}_{z}[\\log(1 - D(G(z)))]$$</td>\n        <td>由<strong>生成器 $G$（學生/偽鈔者）</strong>與<strong>鑑別器 $D$（老師/警察）</strong>對抗訓練：$D$ 學習分辨真實資料（1）與生成作品（0），$G$ 則努力讓 $D(G(z)) \\to 1$</td>\n        <td><span class=\"val-up\">Ian Goodfellow (2014)</span></td>\n      </tr>\n      <tr>\n        <td>03</td>\n        <td><strong>StyleGAN 與 AdaIN 風格注入</strong></td>\n        <td>$$\\text{AdaIN}(x_i, y) = y_{s,i}\\frac{x_i - \\mu(x_i)}{\\sigma(x_i)} + y_{b,i}$$</td>\n        <td>將潛向量 $z$ 映射為 $w \\in \\mathbb{R}^{512}$，經仿射轉換 $Aw+b=(y_s, y_b)$ 後透過 <strong>AdaIN</strong> 在各解析度層注入風格（如同不斷提醒 AI 畫風的 Prompt）</td>\n        <td><span class=\"val-down\">ThisPersonDoesNotExist</span></td>\n      </tr>\n      <tr>\n        <td>04</td>\n        <td><strong>Pix2Pix 與 CycleGAN</strong></td>\n        <td>成對條件式 $G(x) \\leftrightarrow D(x, y)$ vs. 雙向循環 $G: A \\to B, F: B \\to A$</td>\n        <td><strong>Pix2Pix</strong> 需成對影像（如線稿變街景、衛星圖變地圖）；<strong>CycleGAN</strong> 透過雙生成器與雙鑑別器實現非成對跨領域轉換（如馬變斑馬）</td>\n        <td><span class=\"val-steel\">朱俊彥等 (2017)</span></td>\n      </tr>\n      <tr>\n        <td>05</td>\n        <td><strong>資訊量与香農熵 (Entropy)</strong></td>\n        <td>$$I(x) = -\\log P(x), \\quad H(P) = -\\sum_{i=1}^n p_i \\log p_i$$</td>\n        <td>事件發生機率越低，發生時的「驚訝指數（資訊量 $I(x)$）」越高；<strong>熵 $H(P)$</strong> 為平均資訊量，代表機率分佈的亂度與不確定性</td>\n        <td><span class=\"val-steel\">資訊理論基礎</span></td>\n      </tr>\n      <tr>\n        <td>06</td>\n        <td><strong>交叉熵 (Cross-Entropy) 與 KL 散度</strong></td>\n        <td>$$H(P, Q) = -\\sum_{i=1}^n y_i \\log \\hat{y}_i, \\quad D_{\\text{KL}}(P \\parallel Q) = H(P,Q) - H(P)$$</td>\n        <td>One-Hot 標籤下 $H(P,Q) = -\\log \\hat{y}_i$，專注懲罰「正確類別預測機率過低」；<strong>KL 散度</strong>則適合衡量兩機率分佈距離（如知識蒸餾 Soft Target 學習）</td>\n        <td><span class=\"val-down\">分類與 LLM 核心 Loss</span></td>\n      </tr>\n    </tbody>\n  </table>\n\n  <p class=\"table-footnote\">註：課堂講義第 72~81 頁以數值實例證明：當正確答案為第一類 $[1, 0, 0]$ 時，模型一 $[0.7, 0.3, 0]$ 與模型二 $[0.7, 0.19, 0.11]$ 的 MSE 雖不同（<code>0.14</code> vs. <code>0.18</code>），但 Cross-Entropy 皆為 <code>0.36</code>，能精準聚焦於正確類別的信心度。</p>\n\n  ### 課堂核心觀念：GAN 演進譜系與生成式 AI 兩大隨機性機制\n\n  <div class=\"dashboard-grid\">\n    <div>\n      <h4>1. GAN 家族五大高光時刻</h4>\n      <ul>\n        <li><strong>WGAN</strong>：改善傳統 GAN 訓練不穩定與<strong>模式崩壞（Mode Collapse，學生只固定畫同一張老師會給過的圖）</strong>問題。</li>\n        <li><strong>Progressive GAN (NVIDIA, 2018)</strong>：從 $4 \\times 4 \\to 8 \\times 8 \\to \\dots \\to 1024 \\times 1024$ 漸進式拉高解析度，首度生成高畫質逼真名人臉孔。</li>\n        <li><strong>StyleGAN</strong>：以 $w \\in \\mathbb{R}^{512}$ 搭配 <code>AdaIN</code> 控制各層次視覺特徵（粗層管臉型姿態、細層管膚色髮絲）。</li>\n        <li><strong>Pix2Pix / CycleGAN</strong>：開啟影像到影像轉換（Image-to-Image Translation）與無成對資料風格轉換時代。</li>\n      </ul>\n    </div>\n    <div>\n      <h4>2. 為什麼 AI 每次輸出都不一樣？</h4>\n      <ul>\n        <li><strong>圖像生成模型（GAN / Diffusion）</strong>：在<strong>輸入端</strong>從機率分佈隨機抽樣潛張量 $\\mathbf{z}$（靈感種子），再經確定性網路生成影像。</li>\n        <li><strong>大型語言模型（LLM）</strong>：在<strong>輸出端</strong>透過 Softmax 算出下一個 Token 的機率分佈 $Q$，不固定取最大值（Argmax），而是<strong>依機率分佈進行抽樣（Sampling）</strong>，因此每次對話皆有變化。</li>\n      </ul>\n    </div>\n  </div>\n\n  <div class=\"callout-box\">\n    <span class=\"callout-title\">課程摘要重點</span>\n    <ul>\n      <li><strong>潛張量（Latent Tensor $\\mathbf{z}$）破解一對多平均化問題</strong>：若要求神經網路對同一輸入給出多種可能輸出，直接訓練只會得到模糊平均值；引入隨機抽樣的潛向量 $\\mathbf{z}$ 作為「靈感」，才能讓確定性函數生成多樣化作品。</li>\n      <li><strong>GAN 的雙網路對抗本質</strong>：生成器 $G$ 與鑑別器 $D$ 透過極小極大博弈（Minimax Game）同步進化；後續 StyleGAN 進一步將潛向量映射為 $w$ 並透過 <code>AdaIN</code> 注入各層，奠定現代生成模型「條件控制（Conditioning）」的基礎。</li>\n      <li><strong>為什麼分類與語言模型必用 Cross-Entropy 而非 MSE？</strong>：在 One-Hot 真實標籤下，$H(P,Q) = -\\log \\hat{y}_i$ 只看模型對正確答案預測的機率 $\\hat{y}_i$，當預測錯誤且過度自信（$\\hat{y}_i \\to 0$）時會給予趨近無窮大的梯度懲罰，收斂效率遠優於 MSE。</li>\n      <li><strong>KL 散度與知識蒸餾（Knowledge Distillation）</strong>：當真實目標不是非黑即白的 One-Hot，而是老師模型輸出的機率分佈（Soft Target，如 <code>[0.7, 0.25, 0.05]</code>）時，最小化 $D_{\\text{KL}}(P \\parallel Q) = H(P,Q) - H(P)$ 可讓學生模型完整學到老師的「判斷思路」。</li>\n    </ul>\n  </div>\n</div>\n\n<div class=\"module-block block-b\">\n  <div class=\"card-title\">\n    <span>二、作業摘要 <span class=\"pipe-sep\">｜</span> 呆萌型機器人企劃：台股量化短線趨勢預測 AI Canvas</span>\n    <a href=\"raw/HW/03_中興大學 8113026207 科管博 薛慧婷.pdf\" target=\"_blank\" class=\"pdf-link\">📄 開啟作業實作 PDF</a>\n  </div>\n\n  ### 1. 領域專家的期望與使用情境（AI Canvas 左半部）\n\n  <table>\n    <thead>\n      <tr>\n        <th>企劃維度</th>\n        <th>設計內容與規格定義</th>\n        <th>解決痛點與決策價值</th>\n      </tr>\n    </thead>\n    <tbody>\n      <tr>\n        <td><strong>機器人定位</strong></td>\n        <td><strong>台股量化短線趨勢預測機器人</strong>（專注單一任務之「呆萌型機器人」）</td>\n        <td>取代人工逐檔翻閱 1,800 檔股票 K 線圖與籌碼表的繁瑣流程，克服散戶追高殺低的情緒偏誤</td>\n      </tr>\n      <tr>\n        <td><strong>核心能力定義</strong></td>\n        <td>提取個股過去 20 個交易日之價量與法人籌碼時間序列特徵，進行未來 5 日走勢三分類機率預測</td>\n        <td>不要求 AI 回答總經新聞或財報細節，只專注做好「短線技術面＋籌碼面型態分類」</td>\n      </tr>\n      <tr>\n        <td><strong>每日使用情境</strong></td>\n        <td>每個交易日下午 <code>15:30</code> 證交所公布三大法人與融資券盤後資料後，自動批次推論全台股標的</td>\n        <td>數秒內輸出各股未來一週走勢機率分佈，篩選 $P(\\text{上漲}) > 70\\%$ 標的作為盤後研究清單</td>\n      </tr>\n    </tbody>\n  </table>\n\n  ### 2. 輸入張量與輸出張量規格（AI Canvas 右半部：Tensor 結構設計）\n\n  <table>\n    <thead>\n      <tr>\n        <th>張量類型</th>\n        <th>張量維度 (Shape)</th>\n        <th>細部特徵 / 類別定義</th>\n        <th>正規化與工程處理設計</th>\n      </tr>\n    </thead>\n    <tbody>\n      <tr>\n        <td><strong>輸入張量 $\\mathbf{X}$</strong><br/>（時間序列矩陣）</td>\n        <td><span class=\"val-steel\">$[20, 8]$ 二階張量</span><br/>（連續 20 交易日 $\\times$ 8 項特徵）</td>\n        <td>\n          <strong>技術價量（5 項）</strong>：<br/>\n          1. 標準化收盤價、2. 當日振幅 <code>(高-低)/收</code>、3. 成交量倍數（相對 20MA）、4. 5日均線斜率、5. 20日均線斜率<br/>\n          <strong>法人籌碼（3 項）</strong>：<br/>\n          6. 外資買賣超佔比、7. 投信買賣超佔比、8. 融資增減比率\n        </td>\n        <td>以視窗第 1 天為基準計算相對漲跌幅與成交金額佔比，<strong>消除高價股（千元）與低價股（十元）的絕對數值尺度差異</strong></td>\n      </tr>\n      <tr>\n        <td><strong>輸出張量 $\\hat{\\mathbf{y}}$</strong><br/>（Softmax 機率向量）</td>\n        <td><span class=\"val-down\">$[3]$ 一階機率向量</span><br/>（$\\sum_{i=1}^3 \\hat{y}_i = 100\\%$）</td>\n        <td>\n          1. <strong>$P(\\text{上漲})$</strong>：未來 5 日最大漲幅 $> +3\\%$（突破走勢）<br/>\n          2. <strong>$P(\\text{盤整})$</strong>：未來 5 日波動介於 $-3\\% \\sim +3\\%$（箱型整理）<br/>\n          3. <strong>$P(\\text{下跌})$</strong>：未來 5 日最大跌幅 $< -3\\%$（破底走勢）\n        </td>\n        <td>輸出層採用 <code>Softmax</code> 函數，訓練損失函數對應採用課堂所學之 <strong>Cross-Entropy Loss</strong></td>\n      </tr>\n    </tbody>\n  </table>\n\n  ### 3. 四大官方/開源數據來源與 192 萬筆訓練樣本估算\n\n  <div class=\"dashboard-grid\">\n    <div>\n      <h4>公開數據來源管線（Data Pipeline）</h4>\n      <ul>\n        <li><strong>TWSE 臺灣證券交易所 OpenAPI</strong>（<code>openapi.twse.com.tw</code>）：上市個股每日收盤行情、三大法人買賣超與融資融券餘額。</li>\n        <li><strong>TWSE 歷史行情 WebAPI</strong>：依日期與股票代碼批次抓取過去 5 年歷史日 K 線與籌碼序列。</li>\n        <li><strong>TPEx 櫃買中心 OpenAPI</strong>（<code>tpex.org.tw/openapi</code>）：上櫃公司每日價量與法人籌碼數據。</li>\n        <li><strong>FinMind 金融開源資料庫</strong>：提供清洗後之台股結構化歷史資料（<code>TaiwanStockPrice</code>、<code>TaiwanStockInstitutionalInvestorsBuySell</code>）。</li>\n      </ul>\n    </div>\n    <div>\n      <h4>訓練集規模估算（Sliding Window 切片法）</h4>\n      <ul>\n        <li><strong>有效標的數</strong>：扣除流動性過低與全額交割股後，約 <code>1,600 檔</code> 上市櫃股票。</li>\n        <li><strong>時間跨度</strong>：過去 5 年歷史資料（每年約 240 個交易日，共約 <code>1,200 個交易日</code>）。</li>\n        <li><strong>滑動視窗生成樣本</strong>：以「過去 20 天為輸入 $\\mathbf{X}$、未來 5 天走勢為標籤 $\\mathbf{y}$」逐日滑動 1 天，總訓練樣本數達：<br/>\n        $$1,600 \\text{ 檔} \\times 1,200 \\text{ 天} \\approx \\mathbf{192\\text{ 萬筆訓練數據}}$$</li>\n      </ul>\n    </div>\n  </div>\n\n  <div class=\"callout-box\">\n    <span class=\"callout-title\">作業摘要重點</span>\n    <ul>\n      <li><strong>聚焦單一任務的「呆萌型機器人」設計哲學</strong>：不追求包山包海的通用對話，而是將任務嚴格收斂為「輸入 $[20, 8]$ 價量籌碼張量 $\\to$ 輸出 $[3]$ 維未來五日走勢機率向量」的函數學習機。</li>\n      <li><strong>跨股價尺度的特徵無因次化（Normalization）</strong>：台股個股股價從 10 元到 3,000 元不等、股本大小亦差百倍；作業將收盤價轉為相對漲跌幅、法人買賣超轉為「佔當日成交金額比例」，讓所有股票共享同一套神經網路權重。</li>\n      <li><strong>滑動視窗（Sliding Window）最大化數據價值</strong>：透過 20 日特徵視窗搭配 5 日預測視窗在 1,600 檔股票 $\\times$ 5 年歷史序列上滑動切片，無須人工標註即可自動建構出 <code>192 萬筆</code> 高品質監督式學習樣本。</li>\n    </ul>\n  </div>\n</div>\n\n<div class=\"module-block block-c\">\n  <div class=\"card-title\">\n    <span>三、技術關聯與延伸應用 <span class=\"pipe-sep\">｜</span> 從 Week 03 企劃規格到 Week 05 真實系統落地</span>\n  </div>\n\n  <table>\n    <thead>\n      <tr>\n        <th>理論與企劃維度 (Week 03)</th>\n        <th>課堂數學模型 (`03_PPT`)</th>\n        <th>後續實作落地 (`Week 05` 選股系統)</th>\n        <th>跨週次工程驗證結論</th>\n      </tr>\n    </thead>\n    <tbody>\n      <tr>\n        <td><strong>輸入張量規格</strong></td>\n        <td>二階張量（矩陣）表示時間序列特徵 $\\mathbf{X} \\in \\mathbb{R}^{20 \\times 8}$</td>\n        <td>於 Week 05 抓取 0050 成分股真實歷史資料，建構 $20 \\times 8 = 160$ 維標準化特徵</td>\n        <td><span class=\"val-down\">規格 100% 沿用落地</span>，驗證無因次化特徵可跨股通用</td>\n      </tr>\n      <tr>\n        <td><strong>輸出與損失函數</strong></td>\n        <td>Softmax 機率分佈 $\\hat{\\mathbf{y}}$ 搭配交叉熵 $H(P,Q) = -\\sum y_i \\log \\hat{y}_i$</td>\n        <td>Week 05 以 Softmax 迴歸訓練並以 <strong>Cross-Entropy (Log-loss)</strong> 評估測試集表現</td>\n        <td>測試集 Log-loss 達 <span class=\"val-down\">0.948</span>，高信心群組（$\\ge 60\\%$）實際勝率達 <code>58.8%</code></td>\n      </tr>\n      <tr>\n        <td><strong>確定性 vs. 隨機抽樣</strong></td>\n        <td>LLM 輸出端對 Softmax 機率分佈進行隨機抽樣（Sampling）導致每次回答不同</td>\n        <td>Week 04 發現 LLM 抽樣會導致排序與數字幻覺；Week 05 改用 JS 確定性邏輯執行篩選</td>\n        <td><span class=\"val-up\">理解隨機性來源</span>後，能精準區分何時該用機率模型、何時該用確定性程式</td>\n      </tr>\n      <tr>\n        <td><strong>知識蒸餾延伸</strong></td>\n        <td>KL 散度 $D_{\\text{KL}}(P \\parallel Q)$ 衡量老師與學生模型 Soft Target 分佈距離</td>\n        <td>未來可先訓練大型 Transformer 教師模型，再透過 KL 散度蒸餾至輕量前端權重</td>\n        <td>兼顧複雜非線性時序特徵捕捉與 GitHub Pages 零伺服器毫秒級推論</td>\n      </tr>\n    </tbody>\n  </table>\n\n  <p class=\"table-footnote\">跨週次知識閉環：第 03 週透過 AI Canvas 定義的 $[20, 8]$ 輸入張量、三分類 Softmax 輸出與 Cross-Entropy 評估指標，正是第 05 週「台股盤後選股報告產生器」能夠直接寫成 Python 訓練腳本與前端推論引擎的核心藍圖。</p>\n\n  <div class=\"callout-box\">\n    <span class=\"callout-title\">技術關聯與延伸應用重點</span>\n    <ul>\n      <li><strong>AI Canvas 是連結商業痛點與張量數學的橋樑</strong>：先在 Week 03 把「散戶盤後選股痛點」轉譯為明確的 $[20, 8] \\to [3]$ 張量規格與資料源 API，後續在 Week 05 進行 Vibe Coding 時就能直接轉化為可執行的軟體規格書。</li>\n      <li><strong>從理論理解為何 LLM 不適合直接做數值排序</strong>：本週課堂揭示 LLM 的本質是在輸出端對 Softmax 分佈做「機率抽樣（Sampling）」，這解釋了為何每次問 AI 結果都略有不同，也奠定了 Week 05「模型算機率、JavaScript 確定性程式做排序」的架構決策。</li>\n      <li><strong>進階研究方向（結合 KL 散度模型蒸餾與 GAN 資料擴增）</strong>：針對台股極端行情（如崩盤或暴漲）樣本較少的不平衡問題，未來可借鏡本週所學之 <strong>TimeGAN 生成合成時間序列樣本</strong>，或使用 <strong>KL 散度知識蒸餾</strong>將深層時序模型壓縮為前端輕量模型。</li>\n    </ul>\n  </div>\n</div>\n\n<div class=\"back-nav-bar\" style=\"margin-top: 2rem;\">\n  <a href=\"#/\" class=\"btn-back-index\">← 回到課程總覽目錄</a>\n  <div>\n    <a href=\"#/week-02\" class=\"btn-back-index\">← 上一週：Week 02</a>\n    <a href=\"#/week-05\" class=\"btn-back-index\">下一週：Week 05 →</a>\n  </div>\n</div>\n", "week-05.md": "<div class=\"back-nav-bar\">\n  <a href=\"#/\" class=\"btn-back-index\">← 回到課程總覽目錄</a>\n  <a href=\"#/week-03\" class=\"btn-back-index\">← 上一週：Week 03 AI 為什麼每次都不一樣</a>\n</div>\n\n# 第 05 週課程精要：Transformer 注意力機制與 Vibe Coding 互動網頁實作\n\n<p class=\"report-subtitle\">從 RNN 記憶機制、QKV 自注意力與位置編碼原理，到結合 Softmax 預測模型與 GitHub Actions 的台股盤後選股互動網站。</p>\n\n<div class=\"pill-row\">\n  <span class=\"badge badge-latest\">Week 05 · 最新</span>\n  <span class=\"badge badge-sky\">RNN 與 Transformer 原理</span>\n  <span class=\"badge badge-emerald\">Vibe Coding 互動網頁</span>\n</div>\n\n<hr class=\"report-divider\" />\n\n<div class=\"dashboard-card\">\n  <div class=\"section-kicker\">▼ 概覽：本週教材來源與複習區段</div>\n  <p style=\"margin: 0.25rem 0 0.75rem 0;\">\n    <strong>課堂講義來源</strong>：<a href=\"raw/PPT/05AI怎麼記得前面說過什麼？.pdf\" target=\"_blank\">05AI怎麼記得前面說過什麼？.pdf</a>（共 86 頁，政治大學 蔡炎龍老師）<br/>\n    <strong>作業實作來源</strong>：<a href=\"raw/HW/05_中興大學 8113026207 科管博 薛慧婷 用 Vibe Coding 做出一個互動網頁.pdf\" target=\"_blank\">05_中興大學 8113026207 科管博 薛慧婷 用 Vibe Coding 做出一個互動網頁.pdf</a>（<a href=\"https://huitinghsueh45-lab.github.io/tw-stock-report/\" target=\"_blank\">開啟線上互動網站</a>｜<a href=\"https://github.com/huitinghsueh45-lab/tw-stock-report\" target=\"_blank\">GitHub 原始碼</a>）\n  </p>\n  <div class=\"pill-row\">\n    <span class=\"badge badge-emerald\">一、課程摘要</span>\n    <span class=\"badge badge-outline\">二、作業摘要</span>\n    <span class=\"badge badge-outline\">三、技術關聯與延伸應用</span>\n  </div>\n  <p class=\"table-footnote\">本頁依「課程摘要」、「作業摘要」、「技術關聯與延伸應用」結構編排，各區段標題右側均可直接點選開啟原始 PDF 檔案。</p>\n</div>\n\n<div class=\"module-block block-a\">\n  <div class=\"card-title\">\n    <span>一、課程摘要 <span class=\"pipe-sep\">｜</span> AI 怎麼記得前面說過什麼？（RNN・QKV 注意力・Vibe Coding）</span>\n    <a href=\"raw/PPT/05AI怎麼記得前面說過什麼？.pdf\" target=\"_blank\" class=\"pdf-link\">📄 開啟課堂講義 PDF</a>\n  </div>\n\n  <table>\n    <thead>\n      <tr>\n        <th>序號</th>\n        <th>核心概念模組</th>\n        <th>數學定義 / 運算機制</th>\n        <th>設計目的與關鍵特性</th>\n        <th>複習關鍵指標</th>\n      </tr>\n    </thead>\n    <tbody>\n      <tr>\n        <td>1</td>\n        <td><strong>遞歸神經網路 (RNN)</strong></td>\n        <td>$\\mathbf{h}_t = \\sigma(W_X^T \\mathbf{x}_t + W_H^T \\mathbf{h}_{t-1} + \\mathbf{b})$</td>\n        <td>將上一步的隱藏狀態 $\\mathbf{h}_{t-1}$ 傳回當下步驟，使網路具備序列記憶</td>\n        <td>逐步依序讀取、難以平行化</td>\n      </tr>\n      <tr>\n        <td>2</td>\n        <td><strong>QKV 縮放點積注意力</strong></td>\n        <td>$\\text{Attention}(Q,K,V) = \\text{softmax}\\left(\\frac{QK^T}{\\sqrt{d_k}}\\right)V$</td>\n        <td>以內積計算 Query 與 Key 的相關強度；除以 $\\sqrt{d_k}$ 避免 Softmax 贏者通吃</td>\n        <td><span class=\"val-down\">Attention Is All You Need</span></td>\n      </tr>\n      <tr>\n        <td>3</td>\n        <td><strong>多頭與跨模態注意力</strong></td>\n        <td>$Q=XW_Q^n, K=XW_K^n, V=XW_V^n$</td>\n        <td>Decoder 透過 Mask 遮蔽未來資訊；中間層以 $Q_{\\text{dec}}$ 查詢 Encoder 的 $K, V$</td>\n        <td>文字生圖混入語意之核心機制</td>\n      </tr>\n      <tr>\n        <td>4</td>\n        <td><strong>位置編碼 (Positional Encoding)</strong></td>\n        <td>$p_{2k}=\\sin(\\omega_k t), \\; p_{2k+1}=\\cos(\\omega_k t)$，$\\omega_k = 10000^{-2k/d}$</td>\n        <td>為平行化 Self-Attention 補回字詞先後順序（低位數時鐘快、高位數時鐘慢）</td>\n        <td>$\\mathbf{x}_t + \\mathbf{p}_t$ 疊加位置資訊</td>\n      </tr>\n      <tr>\n        <td>5</td>\n        <td><strong>深層穩定技術 (ResNet &amp; Norm)</strong></td>\n        <td>殘差 $\\mathbf{z} + \\ell(\\mathbf{z})$；LayerNorm / RMSNorm / DyT</td>\n        <td>殘差連結讓網路只學「未學會的差值 $\\ell(\\mathbf{z})=f(\\mathbf{z})-\\mathbf{z}$」，撫平損失地形</td>\n        <td><span class=\"val-up\">Llama RMSNorm / Meta DyT</span></td>\n      </tr>\n      <tr>\n        <td>6</td>\n        <td><strong>Vibe Coding 規格書工作流</strong></td>\n        <td>正確的資訊 ＋ 清楚的指引 $\\rightarrow$ 規格書 $\\rightarrow$ <code>index.html</code></td>\n        <td>先請 AI 提問釐清需求產出規格書，再生成單檔網頁並部署至 GitHub Pages</td>\n        <td>HTML + CSS + JS 單檔部署</td>\n      </tr>\n    </tbody>\n  </table>\n\n  <p class=\"table-footnote\">線性代數核心直覺：矩陣乘法「先列後行」，向量乘以矩陣（如 $\\text{softmax}(QK^T)V$）本質上就是用注意力權重係數 $\\alpha_t$ 對 $V$ 矩陣的列向量 $\\mathbf{v}_t$ 做線性組合 $\\sum_{t=1}^T \\alpha_t \\mathbf{v}_t$。</p>\n\n  <div class=\"callout-box\">\n    <span class=\"callout-title\">課程摘要重點</span>\n    <ul>\n      <li><strong>從 RNN 到 Transformer 的典範轉移</strong>：RNN 透過把上一步輸出 $\\mathbf{h}_{t-1}$ 傳回來記憶前文，但必須逐字計算；Google 在 2017 年提出 Transformer，改用矩陣乘法一次平行算完所有字詞間的 <strong>Self-Attention（自注意力）</strong>。</li>\n      <li><strong>看懂 QKV 與 $\\sqrt{d_k}$ 縮放技巧</strong>：每個詞向量經線性轉換產生 Query（問題）、Key（索引）與 Value（內容），透過內積 $QK^T$ 算出關聯度；為了防止 Softmax「贏者通吃」導致權重過度極端，除以 $\\sqrt{d_k}$ 將數值拉回 $0$ 附近再對 $V$ 做加權平均。</li>\n      <li><strong>位置編碼與殘差穩定機制</strong>：利用不同頻率的 $(\\sin, \\cos)$ 時鐘向量為平行輸入補上位置資訊，並搭配 <strong>ResNet 殘差連結（$\\mathbf{z}+\\ell(\\mathbf{z})$）</strong>與 <strong>LayerNorm / RMSNorm</strong>，讓深層網路穩定收斂。</li>\n      <li><strong>Vibe Coding 必殺技</strong>：寫出好程式的關鍵是「和 AI 一起寫規格書」——先要求 AI 不要急著寫 code，而是透過問答釐清需求、產出完整規格書，再一次轉換為互動網頁並透過 GitHub Pages 發布。</li>\n    </ul>\n  </div>\n</div>\n\n<div class=\"module-block block-b\">\n  <div class=\"card-title\">\n    <span>二、作業摘要 <span class=\"pipe-sep\">｜</span> Vibe Coding 實作「盤後快訊：台股選股報告產生器」</span>\n    <a href=\"raw/HW/05_中興大學 8113026207 科管博 薛慧婷 用 Vibe Coding 做出一個互動網頁.pdf\" target=\"_blank\" class=\"pdf-link\">📄 開啟作業實作 PDF</a>\n  </div>\n\n  <table>\n    <thead>\n      <tr>\n        <th>系統模組</th>\n        <th>實作規格與技術細節</th>\n        <th>關鍵參數 / 驗證數據</th>\n        <th>工程設計亮點</th>\n      </tr>\n    </thead>\n    <tbody>\n      <tr>\n        <td><strong>預測模型（W3 落地）</strong></td>\n        <td>台灣 50 成分股（FinMind 約 1 年資料），輸入 <strong>20 交易日 × 8 項價量籌碼特徵</strong>，預測未來 5 日三分類（$\\pm 3\\%$）</td>\n        <td>訓練集 <code>10,240</code> 筆 / 驗證集 <code>3,000</code> 筆（中間留空防重疊）；L2 正則化 <code>0.0002</code></td>\n        <td>Softmax 權重內嵌前端，瀏覽器即時推論與 Python 核對一致</td>\n      </tr>\n      <tr>\n        <td><strong>模型驗證期表現</strong></td>\n        <td>整體準確率 <code>49.1%</code>（基準 <code>44.5%</code>）、Log-loss <code>0.948</code>（基準 <code>1.083</code>）</td>\n        <td>$P(\\text{上漲})\\ge 50\\%$ 實際上漲率 <span class=\"val-up\">54.6%</span>；$\\ge 60\\%$ 達 <span class=\"val-up\">58.8%</span>；$\\ge 70\\%$ 僅 18 筆（<code>66.7%</code>）</td>\n        <td>誠實揭露 $\\ge 70\\%$ 樣本過少限制，不人為調降預設門檻迎合</td>\n      </tr>\n      <tr>\n        <td><strong>確定性報告規則（W4 落地）</strong></td>\n        <td>依原始機率篩選排序、最多列前 5 檔、異常資料自動剔除並提示、自動換算上漲/下跌比與勝率優勢</td>\n        <td>門檻滑桿 <code>50% ~ 90%</code>（預設 <code>70%</code>）；低於 70% 自動改標「自訂門檻觀察股」</td>\n        <td>以確定性 JS 程式取代 LLM 即時生成，精準控制 250~300 字白話重點</td>\n      </tr>\n      <tr>\n        <td><strong>個股明細互動抽屜</strong></td>\n        <td>點擊個股展開三機率長條、週(5日)/月(20日)/季(60日)標準化收盤走勢、量能倍數與外資投信買賣超</td>\n        <td>支援滑鼠/觸控移動即時讀數，並列出近 5 日外資與投信買賣超張數合計</td>\n        <td>桌面版右側滑出、手機版底部滑出＋RWD 卡片式排版（v9 修正）</td>\n      </tr>\n      <tr>\n        <td><strong>GitHub Actions 自動更新</strong></td>\n        <td><code>daily.yml</code> + <code>update_daily.py</code> 每週一至五 22:00 自動抓取並重算最近 10 個交易日</td>\n        <td>三大法人或融資覆蓋率 <span class=\"val-down\">&lt; 80% 自動退回前一交易日</span>；離線備援 <code>2026/10/15</code> 快照</td>\n        <td>徹底解決籌碼未公布時以 0 補值導致預測失準之隱患</td>\n      </tr>\n    </tbody>\n  </table>\n\n  <p class=\"table-footnote\">專案架構：由單一入口 <code>index.html</code>（內含 HTML/CSS/JS 與模型權重）、每日資料檔 <code>real_data.json</code>、更新腳本 <code>update_daily.py</code> 與排程檔 <code>.github/workflows/daily.yml</code> 組成。</p>\n\n  ```javascript\n  // 前端確定性報告篩選、排序與換算指標核心邏輯（對應 W4 規格程式化）\n  function generateReport(stocks, threshold = 0.70) {\n    // 1. 資料異常檢查：三機率加總與 100% 相差超過 1 個百分點則剔除並記錄提示\n    const valid = stocks.filter(s => Math.abs((s.pUp + s.pFlat + s.pDown) - 1.0) <= 0.01);\n\n    // 2. 原始機率篩選（不四捨五入）與雙重排序：P(上漲) 降序 -> P(下跌) 升序\n    const passed = valid\n      .filter(s => s.pUp >= threshold)\n      .sort((a, b) => (b.pUp - a.pUp) || (a.pDown - b.pDown));\n\n    // 3. 換算衍生指標：上漲/下跌比、勝率優勢（百分點）、五級星等（僅 >= 70% 計星）\n    return passed.slice(0, 5).map(s => ({\n      ...s,\n      upDownRatio: s.pDown === 0 ? '無下跌機率' : (s.pUp / s.pDown).toFixed(1),\n      edgePts: ((s.pUp - s.pDown) * 100).toFixed(1),\n      stars: s.pUp >= 0.70 ? Math.floor((s.pUp - 0.65) / 0.05) : '不計星'\n    }));\n  }\n  ```\n\n  <div class=\"callout-box\">\n    <span class=\"callout-title\">作業摘要重點</span>\n    <ul>\n      <li><strong>跨週次構想的完整閉環（W3 模型 + W4 規則 + W5 互動網站）</strong>：將第三週停留於規劃的「台股趨勢預測模型」與第四週「選股報告 Prompt」實際打造成每天可打開、30 秒讀完重點的線上系統。</li>\n      <li><strong>前端內嵌模型與誠實量化評估</strong>：以台灣 50 成分股 $20 \\times 8$ 特徵訓練 Softmax 迴歸，驗證期證明 $P(\\text{上漲}) \\ge 60\\%$ 群組實際上漲率提升至 <code>58.8%</code>；面對預設 <code>70%</code> 門檻下最新日無股票達標（最高 68.5%），誠實呈現「0 檔版面」並引導使用者操作門檻滑桿。</li>\n      <li><strong>九輪迭代（v1～v9）的工程除錯</strong>：透過與 Claude 協作經歷 9 個版本演進，不僅解決了手機版表格裁切問題（改為 RWD 卡片），更抓出「籌碼未公布時補 0 導致預測失真」的關鍵 Bug，建立覆蓋率 $<80\\%$ 自動回退前一交易日的防護機制。</li>\n    </ul>\n  </div>\n</div>\n\n<div class=\"module-block block-c\">\n  <div class=\"card-title\">\n    <span>三、技術關聯與延伸應用 <span class=\"pipe-sep\">｜</span> 規格驅動開發（Spec-Driven）與混合式 AI 系統設計</span>\n  </div>\n\n  <table>\n    <thead>\n      <tr>\n        <th>技術維度</th>\n        <th>課堂理論基礎 (`raw/PPT/05_*.pdf`)</th>\n        <th>作業系統落實 (`raw/HW/05_*.pdf`)</th>\n        <th>軟體工程與 AI 實務啟示</th>\n      </tr>\n    </thead>\n    <tbody>\n      <tr>\n        <td><strong>序列特徵與機率輸出</strong></td>\n        <td>時間序列張量表示與 Softmax 機率正規化</td>\n        <td>以 <code>20 日 × 8 特徵</code> 預測上漲/盤整/下跌三類機率，加總嚴格為 100%</td>\n        <td>金融時序預測需留空切分訓練/驗證期，防止未來資訊洩漏（Data Leakage）</td>\n      </tr>\n      <tr>\n        <td><strong>確定性邏輯 vs. LLM</strong></td>\n        <td>Prompt 強調「正確資訊＋清楚指引」與規格書先行</td>\n        <td>將 W4 中 LLM 做不好的「字數控制、精確排序、邊界條件」改由 JS 確定性程式實作</td>\n        <td><span class=\"val-down\">Neuro-Symbolic 混合思維</span>：用 AI 寫出嚴謹的確定性規則程式，比每次叫 LLM 硬算更可靠</td>\n      </tr>\n      <tr>\n        <td><strong>人機協作分工模式</strong></td>\n        <td>領域專家（人類）定義問題與驗收，AI 負責撰寫規格與程式碼</td>\n        <td>作者負責決策方向（縮減規模為台灣 50、定義籌碼回退規則、手機實測），Claude 負責實作</td>\n        <td>印證第 02 週 Dive Point：「AI 落地為什麼領域專家才是關鍵」</td>\n      </tr>\n      <tr>\n        <td><strong>自動化資料管線</strong></td>\n        <td>GitHub 儲存庫建置與 GitHub Pages 靜態網站發布</td>\n        <td>結合 GitHub Actions 定時爬蟲、資料完整性驗證與前端離線快照備援</td>\n        <td>將靜態展示頁升級為具備 MLOps 每日自動推論能力之輕量級生產系統</td>\n      </tr>\n    </tbody>\n  </table>\n\n  <p class=\"table-footnote\">延伸思考：目前作業採用線性 Softmax 迴歸處理拉平後的 $20 \\times 8$ 特徵；未來若要進一步捕捉跨日時間依賴性，即可直接套用本週課堂所學之 <strong>RNN 或 Transformer Self-Attention 層</strong>！</p>\n\n  <div class=\"callout-box\">\n    <span class=\"callout-title\">技術關聯與延伸應用重點</span>\n    <ul>\n      <li><strong>用 AI 寫「確定性程式」解決 LLM 幻覺</strong>：第四週發現直接叫 LLM 產出報告時，常在排序、小數點判斷與字數控制上出錯；第五週透過 Vibe Coding 請 AI 將這些規則寫成 JavaScript 函數，完美兼具「規則零誤差」與「零 API 推論成本」。</li>\n      <li><strong>規格驅動與漸進式驗證（Mock → Real → MLOps）</strong>：先以模擬數據（v1~v4）驗收所有極端情境（>5檔、0檔、資料異常），再接上 Colab 訓練的真實模型（v5），最後部署 GitHub Actions 自動化管線（v6~v9），是極佳的 AI 輔助軟體工程範本。</li>\n      <li><strong>模型演進方向</strong>：本系統已具備完整的 $20 \\times 8$ 時間序列資料管線與驗證基準（Log-loss <code>0.948</code>），後續可將底層模型由 Softmax 迴歸替換為本週課堂講授的 <strong>Transformer Encoder（以 20 個交易日為 Token 序列計算 Self-Attention）</strong>，進一步捕捉關鍵交易日的量價注意力權重。</li>\n    </ul>\n  </div>\n</div>\n\n<div class=\"back-nav-bar\" style=\"margin-top: 2rem;\">\n  <a href=\"#/\" class=\"btn-     (function() {
      const OrigXHR = window.XMLHttpRequest;
      function resolveFallbackKey(url) {
        if (!url) return null;
        const clean = url.split('?')[0].split('#')[0].replace(/\\/g, '/');
        const parts = clean.split('/');
        const filename = parts[parts.length - 1] || 'index.md';
        if (window.__DOCS_FALLBACK__[filename]) return filename;
        if (clean.endsWith('/docs/') || clean.endsWith('/docs')) return 'index.md';
        return null;
      }

      window.XMLHttpRequest = function() {
        const xhr = new OrigXHR();
        const origOpen = xhr.open;
        const origSend = xhr.send;
        let targetUrl = '';

        xhr.open = function(method, url, ...rest) {
          targetUrl = url;
          return origOpen.call(this, method, url, ...rest);
        };

        xhr.send = function(body) {
          const key = resolveFallbackKey(targetUrl);
          if (window.location.protocol === 'file:' && key) {
            setTimeout(function() {
              const content = window.__DOCS_FALLBACK__[key];
              Object.defineProperty(xhr, 'status', { value: 200, configurable: true });
              Object.defineProperty(xhr, 'readyState', { value: 4, configurable: true });
              Object.defineProperty(xhr, 'responseText', { value: content, configurable: true });
              Object.defineProperty(xhr, 'response', { value: content, configurable: true });
              if (typeof xhr.onreadystatechange === 'function') xhr.onreadystatechange();
              if (typeof xhr.onload === 'function') xhr.onload();
              xhr.dispatchEvent(new Event('load'));
              xhr.dispatchEvent(new Event('loadend'));
            }, 0);
            return;
          }

          xhr.addEventListener('error', function(e) {
            if (key) {
              e.stopImmediatePropagation();
              const content = window.__DOCS_FALLBACK__[key];
              Object.defineProperty(xhr, 'status', { value: 200, configurable: true });
              Object.defineProperty(xhr, 'readyState', { value: 4, configurable: true });
              Object.defineProperty(xhr, 'responseText', { value: content, configurable: true });
              Object.defineProperty(xhr, 'response', { value: content, configurable: true });
              if (typeof xhr.onload === 'function') xhr.onload();
              xhr.dispatchEvent(new Event('load'));
            }
          }, true);

          xhr.addEventListener('load', function() {
            if ((xhr.status === 404 || xhr.status === 0) && key) {
              const content = window.__DOCS_FALLBACK__[key];
              Object.defineProperty(xhr, 'status', { value: 200, configurable: true });
              Object.defineProperty(xhr, 'responseText', { value: content, configurable: true });
              Object.defineProperty(xhr, 'response', { value: content, configurable: true });
            }
          }, true);

          return origSend.call(this, body);
        };
        return xhr;
      };
